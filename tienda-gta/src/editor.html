<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor de outfits GTA</title>
<style>
  @font-face { font-family: 'HudPixel'; src: url('../assets/fonts/jersey10.woff2') format('woff2'); }
  @font-face { font-family: 'Anton'; src: url('../assets/fonts/anton.woff2') format('woff2'); }
  @font-face { font-family: 'Oswald'; font-weight: 600; src: url('../assets/fonts/oswald600.woff2') format('woff2'); }
  :root { --u: 1px; --blue: #0b1cff; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
  .abs { position: absolute; }
  #photoBg { inset: -4%; width: 108%; height: 108%; object-fit: cover; filter: blur(calc(24 * var(--u))) brightness(.45); display: none; }
  #photo { transform-origin: 50% 45%; filter: contrast(1.08) saturate(1.1) brightness(1.01); }
  #vig { inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 58%, rgba(0,0,0,.42) 100%); }

  /* menú estilo trainer de GTA */
  #menu { width: calc(560 * var(--u)); color: #fff; font-weight: 500; }
  #bf { display: inline-block; background: #e8551f; color: #fff; font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: calc(2 * var(--u));
        font-size: calc(22 * var(--u)); padding: calc(4 * var(--u)) calc(14 * var(--u)); margin-bottom: calc(6 * var(--u)); }
  #head { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,.86); padding: calc(10 * var(--u)) calc(16 * var(--u));
          font-size: calc(22 * var(--u)); font-weight: 700; letter-spacing: calc(.5 * var(--u)); text-transform: uppercase; }
  #head img { height: calc(30 * var(--u)); }
  #panel { background: rgba(0,0,0,.62); padding: calc(4 * var(--u)) 0; }
  .row { display: flex; align-items: center; height: calc(46 * var(--u)); margin: 0 calc(6 * var(--u)); padding: 0 calc(12 * var(--u)); gap: calc(10 * var(--u));
         font-size: calc(22 * var(--u)); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .row .st { width: calc(20 * var(--u)); color: #f5a623; font-size: calc(20 * var(--u)); text-align: center; flex: none; }
  .row .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .p { color: rgba(255,255,255,.85); font-variant-numeric: tabular-nums; }
  .row.on { background: linear-gradient(90deg, #ffffff, #d7d7d7); color: #111; text-shadow: none; }
  .row.on .p { color: #111; }
  .row.buy { color: #9fb2ff; font-weight: 700; }
  .row.buy.on { background: linear-gradient(90deg, #2b3cff, var(--blue)); color: #fff; }
  .row.buy.on .p { color: #fff; }
  #scroll { background: rgba(0,0,0,.86); height: calc(40 * var(--u)); display: flex; align-items: center; justify-content: center; font-size: calc(24 * var(--u)); color: #fff; }
  #desc { background: rgba(0,0,0,.62); margin-top: calc(6 * var(--u)); padding: calc(10 * var(--u)) calc(16 * var(--u)); font-size: calc(19 * var(--u)); line-height: 1.35; color: rgba(255,255,255,.92); }
  #label { display: flex; gap: calc(10 * var(--u)); align-items: center; background: rgba(20,20,20,.78); padding: calc(6 * var(--u)) calc(14 * var(--u));
           font-size: calc(20 * var(--u)); font-weight: 700; letter-spacing: calc(.5 * var(--u)); }
  #label .a { color: #ff4b4b; } #label .b { color: #fff; }

  /* HUD de dinero (aparece al comprar) */
  #hud { text-align: right; opacity: 0; }
  .t { position: relative; font-family: 'HudPixel', monospace; line-height: .92; letter-spacing: calc(1.5 * var(--u)); white-space: nowrap; display: inline-block;
       color: #05302c; -webkit-text-stroke: calc(7 * var(--u)) #05302c; filter: drop-shadow(calc(2 * var(--u)) calc(3 * var(--u)) 0 rgba(0,0,0,.5)); }
  .t::after { content: attr(data-t); position: absolute; left: 0; top: 0; -webkit-text-stroke: 0;
       background: linear-gradient(180deg, #e6fffa 0%, #7ff6dd 36%, #32dcbc 60%, #14a88d 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #money { font-size: calc(58 * var(--u)); }
  #pop { font-size: calc(50 * var(--u)); color: #3a0008; -webkit-text-stroke-color: #3a0008; }
  #pop::after { background: linear-gradient(180deg, #ffd0d0 0%, #ff5a5a 45%, #d10f2a 100%); -webkit-background-clip: text; background-clip: text; }

  #toast { left: 50%; transform: translate(-50%, -50%); opacity: 0; text-align: center; white-space: nowrap; }
  #toast .a { font-family: 'Anton', sans-serif; font-size: calc(78 * var(--u)); color: #fff; letter-spacing: calc(2 * var(--u));
              text-shadow: 0 0 calc(18 * var(--u)) rgba(11,28,255,.9), 0 calc(4 * var(--u)) 0 #000; }
  #toast .b { display: inline-block; margin-top: calc(8 * var(--u)); background: var(--blue); color: #fff; font-family: 'Oswald', sans-serif; font-weight: 600;
              font-size: calc(28 * var(--u)); letter-spacing: calc(3 * var(--u)); padding: calc(6 * var(--u)) calc(18 * var(--u)); }
  #end { inset: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
         background: radial-gradient(ellipse at 50% 45%, rgba(11,28,255,.94), rgba(4,8,90,.97) 70%); }
  #end .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
               background-size: calc(36 * var(--u)) calc(36 * var(--u)); }
  #end h1 { position: relative; margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: calc(104 * var(--u)); line-height: 1; letter-spacing: calc(2 * var(--u));
            color: #2a1800; -webkit-text-stroke: calc(10 * var(--u)) #1a0f00; filter: drop-shadow(calc(3 * var(--u)) calc(5 * var(--u)) 0 rgba(0,0,0,.6)); }
  #end h1::after { content: attr(data-t); position: absolute; left: 0; top: 0; -webkit-text-stroke: 0;
            background: linear-gradient(180deg, #fff6b8 0%, #ffd93a 42%, #f2a900 70%, #b97700 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #end .wm { position: relative; width: calc(760 * var(--u)); margin: calc(40 * var(--u)) 0 calc(20 * var(--u)); }
  #end .fit { position: relative; font-family: 'Oswald', sans-serif; font-weight: 600; color: #fff; font-size: calc(34 * var(--u)); letter-spacing: calc(4 * var(--u)); }
  #end .web { position: relative; font-family: 'Oswald', sans-serif; font-weight: 600; color: #fff; font-size: calc(36 * var(--u)); letter-spacing: calc(2 * var(--u)); margin-top: calc(26 * var(--u));
              background: #000; padding: calc(8 * var(--u)) calc(22 * var(--u)); }
</style>
</head>
<body>
<div id="stage">
  <img id="photoBg" class="abs" alt=""><img id="photo" class="abs" alt=""><div id="vig" class="abs"></div>
  <div id="menu" class="abs">
    <div id="bf"></div>
    <div id="head"><img id="logo" alt=""><span id="cnt"></span></div>
    <div id="panel"></div>
    <div id="scroll">⇕</div>
    <div id="desc"></div>
  </div>
  <div id="label" class="abs"><span class="a">ARCHIF-OUTFIT</span><span class="b" id="labelB"></span></div>
  <div id="hud" class="abs"><div id="money" class="t"></div><br><div id="pop" class="t"></div></div>
  <div id="toast" class="abs"><div class="a">OUTFIT COMPRADO</div><div class="b" id="toastB"></div></div>
  <div id="end" class="abs"><div class="grid"></div><h1 id="endTitle"></h1><img class="wm" id="endWm" alt=""><div class="fit" id="endFit"></div><div class="web" id="endWeb"></div></div>
</div>
<script>
const C = window.CFG;
const FMT = new URLSearchParams(location.search).get('fmt') || '9x16';
const W = 1080, H = FMT === '9x16' ? 1920 : 1350, U = W / 1080;
document.documentElement.style.setProperty('--u', U + 'px');
document.documentElement.style.setProperty('--blue', C.brand.blue);
const $ = s => document.querySelector(s);
const stage = $('#stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
const base = `../tiendas/${C.id}/`;
const clp = v => '$' + Math.round(v).toLocaleString('es-CL').replace(/,/g, '.');
const fmtMoney = v => '$' + String(Math.round(v)).padStart(8, '0');
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = x => Math.max(0, Math.min(1, x));

// Layout
const L = FMT === '9x16'
  ? { menu: [26, 96], ms: .72, label: [26, 1830], hud: [36, 120], toastY: 1060 }
  : { menu: [22, 22], ms: .6, label: [22, 1300], hud: [26, 22], toastY: 700 };
const [iw, ih] = C.photoSize;
let PW, PH_, PX, PY;
if (FMT === '9x16') { const sc = Math.max(W / iw, H / ih); PW = iw * sc; PH_ = ih * sc; PX = (W - PW) / 2; PY = (H - PH_) / 2; }
else { PH_ = H; PW = iw * H / ih; PX = W - PW - 10 * U; PY = 0; $('#photoBg').style.display = 'block'; }
Object.assign($('#photo').style, { left: PX + 'px', top: PY + 'px', width: PW + 'px', height: PH_ + 'px' });
const menu = $('#menu'); Object.assign(menu.style, { left: L.menu[0] + 'px', top: L.menu[1] + 'px', transformOrigin: '0 0', transform: `scale(${L.ms})` });
Object.assign($('#label').style, { left: L.label[0] + 'px', top: L.label[1] + 'px' });
Object.assign($('#hud').style, { right: L.hud[0] + 'px', top: L.hud[1] + 'px' });
$('#toast').style.top = L.toastY + 'px';
if (FMT === '9x16') $('#desc').style.display = 'none';
// solo interfaz: el personaje animado va en una pista de video aparte (src/idle_fondo.py)
if (C.uiOnly) { ['#photo', '#photoBg'].forEach(q => $(q).style.visibility = 'hidden'); stage.style.background = 'transparent'; document.body.style.background = 'transparent'; document.documentElement.style.background = 'transparent'; }

$('#bf').textContent = C.header;
$('#logo').src = base + C.brand.wordmark; $('#endWm').src = base + C.brand.wordmark;
$('#endTitle').textContent = C.end.title; $('#endTitle').dataset.t = C.end.title;
$('#endWeb').textContent = `${C.brand.web} · ${C.brand.handle}`;

// filas: una por prenda + comprar
const rows = C.rows.map(r => {
  const d = document.createElement('div'); d.className = 'row' + (r.buy ? ' buy' : '');
  d.innerHTML = `<span class="st"></span><span class="n">${r.name}</span><span class="p"></span>`;
  $('#panel').appendChild(d); return d;
});
const N = rows.length;

// precarga
const photos = {};
window.ready = Promise.all([document.fonts.ready, ...C.rows.filter(r => r.state).map(r => new Promise(res => {
  const im = new Image(); im.onload = res; im.onerror = res; im.src = base + r.state; photos[r.state] = im;
}))]);

// prendas puestas en cada paso (para estrellas y totales)
const worn = []; { let cur = { ...C.start }; C.rows.forEach((r, i) => { if (r.slot) cur = { ...cur, [r.slot]: r.key }; worn[i] = { ...cur }; }); }
const price = Object.fromEntries(C.rows.filter(r => r.key).map(r => [r.key, r.price]));
const total = w => Object.values(w).reduce((a, k) => a + (price[k] || 0), 0);
const finalIdx = C.rows.findIndex(r => r.buy);
const finalWorn = worn[finalIdx - 1], finalTotal = total(finalWorn);
rows.forEach((d, i) => { d.querySelector('.p').textContent = C.rows[i].buy ? clp(finalTotal) : clp(C.rows[i].price); });

let shown = null;
window.setT = async (t) => {
  await window.ready;
  const TL = C.timeline;
  const k = Math.min(N - 1, Math.floor(t / TL.step));          // fila seleccionada
  const sk = C.rows[k].state ? k : k - 1;                         // foto vigente
  const state = C.rows[sk].state;
  if (state !== shown) { $('#photo').src = base + state; $('#photoBg').src = base + state; shown = state; }
  const w = worn[Math.max(0, sk)];
  rows.forEach((d, i) => {
    d.classList.toggle('on', i === k);
    const r = C.rows[i];
    d.querySelector('.st').textContent = r.key && Object.values(w).includes(r.key) ? '★' : '';
  });
  $('#cnt').textContent = `${k + 1}/${N}`;
  $('#desc').innerHTML = C.rows[k].desc || '';
  $('#labelB').textContent = clp(total(w));
  // respiración y empuje lento de cámara (vista fija como en el juego)
  const z = 1 + .02 * t / TL.dur + .0045 * Math.sin(t * 2 * Math.PI / 2.8);
  $('#photo').style.transform = `scale(${z})`;
  // compra
  const buyT = finalIdx * TL.step, payT = buyT + .45;
  const kp = clamp((t - payT) / .9);
  const hudA = clamp((t - buyT - .2) / .25) * (1 - clamp((t - TL.endAt + .2) / .2));
  $('#hud').style.opacity = hudA;
  const mt = fmtMoney(C.money0 - finalTotal * ease(kp)); $('#money').textContent = mt; $('#money').dataset.t = mt;
  const pp = '-' + clp(finalTotal); $('#pop').textContent = pp; $('#pop').dataset.t = pp; $('#pop').style.opacity = t > payT ? 1 : 0;
  const ta = clamp((t - TL.toastAt) / .25) * (1 - clamp((t - TL.endAt + .2) / .2));
  $('#toast').style.opacity = ta; $('#toast').style.transform = `translate(-50%, -50%) scale(${1.25 - .25 * ease(clamp((t - TL.toastAt) / .3))})`;
  $('#toastB').textContent = `${C.finalName.toUpperCase()} · ${clp(finalTotal)}`;
  const e = clamp((t - TL.endAt) / .45);
  $('#end').style.opacity = e; $('#endTitle').style.transform = `scale(${1.2 - .2 * ease(e)})`;
  $('#endFit').textContent = `${C.finalName.toUpperCase()} · ${clp(finalTotal)}`;
  return true;
};
</script>
</body>
</html>
