<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Erika Vidal Mella · Terapeuta Cognitivo Conductual</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#fbf4e8;--card:#fff;--ink:#1f2350;--soft:#4b4f7a;--sun:#f9c823;--pink:#d6337a;--teal:#1f8a88;--line:#eadfc9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15173a;--card:#1f2350;--ink:#fbf4e8;--soft:#c9c9e6;--line:#33376b;--pink:#ff7fb0;--teal:#5fd0cd}}
:root[data-theme="dark"]{--bg:#15173a;--card:#1f2350;--ink:#fbf4e8;--soft:#c9c9e6;--line:#33376b;--pink:#ff7fb0;--teal:#5fd0cd}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 "Nunito Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Nunito Sans",sans-serif;line-height:1.15;margin:0 0 .6em}
h2{font-size:clamp(1.6rem,4vw,2.1rem)}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
section{padding:48px 0}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.hero{display:grid;gap:28px;align-items:center;padding:36px 0 24px}
@media(min-width:800px){.hero{grid-template-columns:1.25fr 1fr}}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);font-weight:800}
.name{color:var(--soft);font-weight:700;margin:0 0 14px}
.lead{color:var(--soft);max-width:60ch}
.photo{position:relative;width:min(100%,380px);aspect-ratio:1;margin:0 auto}
.photo::before{content:"";position:absolute;inset:-14px 14px 14px -14px;background:var(--sun);border-radius:50%}
.photo img{position:relative;width:100%;height:100%;object-fit:cover;object-position:50% 8%;border-radius:50%;border:5px solid var(--bg)}
.btn{display:inline-block;background:var(--pink);color:#fff;font-weight:700;text-decoration:none;padding:13px 26px;border-radius:999px;border:0;font-size:1rem;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.grid{display:grid;gap:16px}
@media(min-width:700px){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.card h3{font-size:1.2rem;margin-bottom:.3em}
.card p{margin:0;color:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none}
.tags li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:600}
.tags li:nth-child(3n+1){border-color:var(--sun)}
.tags li:nth-child(3n+2){border-color:var(--teal)}
.tags li:nth-child(3n){border-color:var(--pink)}
form{display:grid;gap:18px}
fieldset{border:0;padding:0;margin:0}
legend,label.t{font-weight:700;margin-bottom:8px;display:block;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 15px;cursor:pointer;font-weight:600}
.opts input:checked+label{background:var(--sun);border-color:var(--sun);color:#1f2350}
.opts input:focus-visible+label{outline:3px solid var(--pink);outline-offset:2px}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 14px}
.note{font-size:.92rem;color:var(--soft);margin:0}
.closing{text-align:center;padding:56px 0}
.closing p{font:800 clamp(1.5rem,4vw,2.2rem)/1.2 "Bricolage Grotesque",sans-serif;max-width:22ch;margin:0 auto}
footer{background:var(--ink);color:var(--bg);padding:32px 0;text-align:center}
footer a{font-weight:700}

input[type=password]{width:130px;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.adminlink{font-size:.85rem;opacity:.75;font-weight:400!important}
#gate{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;background:#128c4a;color:#fff;font-weight:700;text-decoration:none;padding:12px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:20}
.wa svg{width:22px;height:22px;fill:#fff}

[hidden]{display:none!important}
select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.adm{margin-top:16px;padding:22px;border:2px dashed var(--pink)}
.chip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:9px 15px;cursor:pointer;font:600 1rem "Nunito Sans",sans-serif}
.chip.off{background:var(--pink);border-color:var(--pink);color:#fff}
.opts input:disabled+label{opacity:.4;text-decoration:line-through;cursor:not-allowed}
</style></head><body><div id="root"></div><script id="app">const STATE=/*S*/{"blocked":{}}/*E*/;

const $=id=>document.getElementById(id);
const pad=n=>(n<10?'0':'')+n;
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=new Intl.DateTimeFormat('es-CL',{weekday:'short',day:'numeric',month:'short'});
function weekdays(n){const o=[],d=new Date();d.setHours(12,0,0,0);while(o.length<n){d.setDate(d.getDate()+1);if(d.getDay()%6)o.push(new Date(d));}return o;}
const pending=JSON.parse(JSON.stringify(STATE.blocked||{}));
$('root').innerHTML=PAGE;
const f=$('f'),days=$('days'),hours=$('hours');
weekdays(10).forEach((d,i)=>days.insertAdjacentHTML('beforeend','<input type="radio" name="d" id="d'+i+'" value="'+iso(d)+'" data-l="'+fmt.format(d)+'"'+(i?'':' checked')+'><label for="d'+i+'">'+fmt.format(d)+'</label>'));
function drawHours(){
  const b=(STATE.blocked||{})[f.d.value]||[];
  hours.innerHTML=HOURS.map((h,i)=>'<input type="radio" name="h" id="h'+i+'" value="'+h+'"'+(b.includes(h)?' disabled':'')+'><label for="h'+i+'">'+h+'</label>').join('');
  const first=hours.querySelector('input:not(:disabled)');
  if(first)first.checked=true;
  $('nohours').hidden=!!first;
}
const notes={
  Online:'La hora online cuesta $20.000 (hora clínica). Al reservar se abre WhatsApp con tu solicitud, donde le pides a Erika los datos de transferencia para dejar tu hora reservada.',
  Presencial:'La atención a domicilio se coordina directamente con Erika: valor, día y hora. Se abre WhatsApp con tu solicitud.'
};
function mode(){
  const p=f.m.value==='Presencial';
  $('dfs').hidden=p;$('hfs').hidden=p;$('addr').hidden=!p;$('a').required=p;
  $('fn').textContent=notes[f.m.value];
}
days.onchange=drawHours;
$('mod').onchange=mode;
mode();drawHours();
f.onsubmit=e=>{
  e.preventDefault();
  const m=f.m.value;let t;
  if(m==='Online'){
    if(!f.h.value)return;
    t='Hola Erika, quiero reservar una hora online.\nNombre: '+f.n.value+'\nDía: '+days.querySelector('input:checked').dataset.l+'\nHora: '+f.h.value+'\nValor: $20.000 (hora clínica)\n¿Me puedes enviar los datos de transferencia para reservar la hora?';
  }else{
    t='Hola Erika, quiero coordinar una atención presencial a domicilio.\nNombre: '+f.n.value+'\nComuna y dirección: '+f.a.value+'\n¿Me indicas valor y horarios disponibles?';
  }
  if(f.c.value)t+='\nComentario: '+f.c.value;
  window.open('https://wa.me/56982194983?text='+encodeURIComponent(t),'_blank','noopener');
};
let CLAVE='';
const api=b=>fetch('/api/horas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
async function load(){try{const r=await fetch('/api/horas',{cache:'no-store'});if(r.ok){const j=await r.json();STATE.blocked=j.blocked||{};drawHours();}}catch(e){}}
load();
function initAdmin(){
  if(!$('admin').hidden)return;
  const sel=$('ad'),box=$('ah'),msg=$('am');
  $('admin').hidden=false;
  weekdays(20).forEach(d=>sel.add(new Option(fmt.format(d),iso(d))));
  const draw=()=>{
    const b=pending[sel.value]||[];
    box.innerHTML=HOURS.map(h=>'<button type="button" class="chip'+(b.includes(h)?' off':'')+'" data-h="'+h+'">'+h+(b.includes(h)?' · ocupada':'')+'</button>').join('');
  };
  box.onclick=e=>{
    const h=e.target.dataset.h;if(!h)return;
    const b=pending[sel.value]||(pending[sel.value]=[]),i=b.indexOf(h);
    if(i<0)b.push(h);else b.splice(i,1);
    if(!b.length)delete pending[sel.value];
    draw();
  };
  sel.onchange=draw;draw();
  $('as').onclick=async()=>{
    const today=iso(new Date()),clean={};
    Object.keys(pending).filter(k=>k>=today).forEach(k=>clean[k]=pending[k]);
    msg.textContent='Guardando…';
    try{
      const r=await api({clave:CLAVE,blocked:clean});
      if(r.ok){STATE.blocked=clean;drawHours();msg.textContent='Guardado ✓';}
      else msg.textContent=r.status===401?'Clave incorrecta.':'No se pudo guardar. Intenta de nuevo.';
    }catch(e){msg.textContent='Sin conexión. Intenta de nuevo.';}
  };
}
$('lg').onclick=e=>{e.preventDefault();$('gate').hidden=false;$('pw').focus();};
$('gate').onsubmit=async e=>{
  e.preventDefault();
  const c=$('pw').value;$('pw').value='';
  try{
    const r=await api({clave:c,accion:'login'});
    if(r.ok){
      CLAVE=c;$('gm').textContent='';$('gate').hidden=true;
      Object.keys(pending).forEach(k=>delete pending[k]);
      Object.assign(pending,JSON.parse(JSON.stringify(STATE.blocked)));
      initAdmin();$('admin').scrollIntoView({behavior:'smooth'});
    }else $('gm').textContent='Clave incorrecta';
  }catch(x){$('gm').textContent='Sin conexión';}
};
</script></body></html>
